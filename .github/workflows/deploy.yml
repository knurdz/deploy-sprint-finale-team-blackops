name: Request Organizer Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: request-organizer-deploy
  cancel-in-progress: false

jobs:
  request-deploy:
    name: Request deployer publish
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        !contains(github.event.workflow_run.head_commit.message, '[skip deploy]')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve deploy request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_SHA: ${{ github.sha }}
          MANUAL_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            sha="$MANUAL_SHA"
            branch="main"
            source_run_id="$MANUAL_RUN_ID"
          else
            sha="$WORKFLOW_RUN_SHA"
            branch="$WORKFLOW_RUN_BRANCH"
            source_run_id="$WORKFLOW_RUN_ID"
          fi

          if [ "$branch" != "main" ]; then
            echo "Only main branch deploy requests are allowed. Got: $branch"
            exit 1
          fi

          {
            echo "sha=$sha"
            echo "branch=$branch"
            echo "source_run_id=$source_run_id"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.sha }}

      - name: Build container image
        env:
          SHA: ${{ steps.request.outputs.sha }}
        run: |
          docker build -t deploy-sprint/team-site:$SHA --build-arg GIT_SHA=$SHA team-site

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image to GHCR
        id: image
        env:
          SHA: ${{ steps.request.outputs.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image=$(echo "ghcr.io/${OWNER}/team-site" | tr '[:upper:]' '[:lower:]')
          docker tag "deploy-sprint/team-site:$SHA" "$image:$SHA"
          docker push "$image:$SHA"
          digest=$(docker image inspect "$image:$SHA" --format '{{index .RepoDigests 0}}' 2>/dev/null || echo 'unknown')
          {
            echo "image=$image:$SHA"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"

      - name: Verify container serves the app
        id: container_check
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -uo pipefail
          healthy=false
          container_id=$(docker run -d --rm -p 8080:80 "$IMAGE") || true

          if [ -n "$container_id" ]; then
            for i in $(seq 1 10); do
              if curl -sf http://localhost:8080/health/ > /dev/null; then
                healthy=true
                break
              fi
              sleep 1
            done
            echo "--- Container log evidence ---"
            docker logs "$container_id" || true
            docker stop "$container_id" >/dev/null 2>&1 || true
          else
            echo "Container failed to start."
          fi

          echo "healthy=$healthy" >> "$GITHUB_OUTPUT"

      - name: Fail if the pushed image doesn't serve correctly
        if: steps.container_check.outputs.healthy != 'true'
        run: |
          echo "::error::Container built from the pushed image failed its health check; not submitting a deploy request."
          exit 1

      - name: Request deploy from organizer deployer
        env:
          DEPLOYER_DISPATCH_TOKEN: ${{ secrets.DEPLOYER_DISPATCH_TOKEN }}
          DEPLOYER_REPO: knurdz/deploy-sprint-deployer
          TEAM_REPO: ${{ github.repository }}
          TEAM_SHA: ${{ steps.request.outputs.sha }}
          TEAM_BRANCH: ${{ steps.request.outputs.branch }}
          SOURCE_RUN_ID: ${{ steps.request.outputs.source_run_id }}
          IMAGE: ${{ steps.image.outputs.image }}
          APP_PORT: ${{ vars.APP_PORT || '8080' }}
          VPS_HOST: ${{ vars.VPS_HOST || '20.51.109.233' }}
        run: |
          set -euo pipefail

          if [ -z "$DEPLOYER_DISPATCH_TOKEN" ]; then
            echo "DEPLOYER_DISPATCH_TOKEN is not configured."
            exit 1
          fi

          python3 - <<'PY' > payload.json
          import json
          import os

          payload = {
              "event_type": "team-blackops-main-merged",
              "client_payload": {
                  "team": "blackops",
                  "repo": os.environ["TEAM_REPO"],
                  "sha": os.environ["TEAM_SHA"],
                  "branch": os.environ["TEAM_BRANCH"],
                  "source_run_id": os.environ["SOURCE_RUN_ID"],
                  "image": os.environ["IMAGE"],
                  "app_port": os.environ["APP_PORT"],
                  "vps_host": os.environ["VPS_HOST"],
              },
          }

          print(json.dumps(payload))
          PY

          curl --fail-with-body --show-error --silent \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DEPLOYER_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${DEPLOYER_REPO}/dispatches" \
            --data @payload.json

          echo "Requested organizer deployment for ${TEAM_REPO}@${TEAM_SHA} (image ${IMAGE}, target ${VPS_HOST}:${APP_PORT})."

      - name: Record container deploy evidence
        if: always()
        env:
          APP_PORT: ${{ vars.APP_PORT || '8080' }}
          VPS_HOST: ${{ vars.VPS_HOST || '20.51.109.233' }}
        run: |
          {
            echo "### Containerized VPS deploy"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Image | \`${{ steps.image.outputs.image }}\` |"
            echo "| Digest | \`${{ steps.image.outputs.digest }}\` |"
            echo "| Container health check (local, port 8080) | \`${{ steps.container_check.outputs.healthy }}\` |"
            echo "| Target VPS host | \`$VPS_HOST\` |"
            echo "| Target app port | \`$APP_PORT\` |"
            echo "| Deploy request submitted to | \`knurdz/deploy-sprint-deployer\` (no SSH credentials used here) |"
          } >> "$GITHUB_STEP_SUMMARY"
