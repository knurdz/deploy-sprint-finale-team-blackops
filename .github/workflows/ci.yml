name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: team-site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: team-site

      - name: Build
        env:
          VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL || vars.DOMAIN_PUBLIC_URL || secrets.PUBLIC_URL || vars.IP_PUBLIC_URL }}
        run: npm run build
        working-directory: team-site

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: team-site/dist

  dry-run-deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: downloaded-dist

      - name: Verify no rebuild happened, list artifact contents
        run: |
          echo "Deploying pre-built artifact only. No npm ci / npm run build in this job."
          find downloaded-dist -maxdepth 2 -type f | sort

      - name: Record artifact identity in workflow summary
        run: |
          {
            echo "### Build-once deploy identity"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Artifact name | \`site-dist-${{ github.sha }}\` |"
            echo "| Commit SHA | \`${{ github.sha }}\` |"
            echo "| Build workflow run | [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
          } >> "$GITHUB_STEP_SUMMARY"
