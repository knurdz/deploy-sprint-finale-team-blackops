name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '20' }}

      - name: Cache npm dependencies
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('team-site/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci
        working-directory: team-site

      - name: Record dependency cache evidence
        run: |
          {
            echo "### Dependency cache"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Cache key | \`${{ runner.os }}-npm-${{ hashFiles('team-site/package-lock.json') }}\` |"
            echo "| Cache hit | \`${{ steps.npm-cache.outputs.cache-hit }}\` |"
            echo "| Install command | \`npm ci\` (working-directory: team-site) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run release readiness check
        run: npm test
        working-directory: team-site

      - name: Build
        env:
          VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL || vars.DOMAIN_PUBLIC_URL || secrets.PUBLIC_URL || vars.IP_PUBLIC_URL }}
          DOMAIN_CONNECTED: ${{ vars.DOMAIN_CONNECTED }}
          ASSIGNED_DOMAIN: ${{ vars.ASSIGNED_DOMAIN }}
          DNS_RECORD_TYPE: ${{ vars.DNS_RECORD_TYPE }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          OPENWEATHER_CITY: ${{ vars.OPENWEATHER_CITY || 'Colombo' }}
          VITE_WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
          WEB3FORMS_TARGET_EMAIL: ${{ vars.WEB3FORMS_TARGET_EMAIL }}
          FEATURE_SHOW_INSIGHTS: ${{ secrets.FEATURE_FLAG_NAME }}
          VITE_FEATURE_SHOW_INSIGHTS: ${{ secrets.FEATURE_FLAG_NAME }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER || 'resend' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: npm run build
        working-directory: team-site

      - name: Record release manifest in summary
        run: |
          {
            echo "### Release manifest"
            echo ""
            echo '```json'
            cat "team-site/dist/${{ vars.RELEASE_MANIFEST_PATH || 'release-manifest.json' }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.sha }}
          path: team-site/dist/${{ vars.RELEASE_MANIFEST_PATH || 'release-manifest.json' }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: team-site/dist

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        working-directory: team-site
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t deploy-sprint/blackops:${{ github.sha }} \
            .

      - name: Smoke-test the built image
        id: smoke
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ vars.GOOGLE_REDIRECT_URI }}
          GOOGLE_SCOPES: ${{ vars.GOOGLE_SCOPES }}
        run: |
          docker run -d --rm --name t14-smoke -p 8080:80 \
            -e GOOGLE_CLIENT_ID \
            -e GOOGLE_CLIENT_SECRET \
            -e SESSION_SECRET \
            -e GOOGLE_REDIRECT_URI \
            -e GOOGLE_SCOPES \
            deploy-sprint/blackops:${{ github.sha }}
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/health/ > /dev/null; then
              echo "Container served /health successfully."
              break
            fi
            if [ "$i" -eq 10 ]; then
              echo "Container never became healthy."
              docker logs t14-smoke
              exit 1
            fi
            sleep 1
          done
          curl -sf http://localhost:8080/ > /dev/null

          auth_status=$(curl -s http://localhost:8080/status/auth)
          echo "auth_status=$auth_status" >> "$GITHUB_OUTPUT"

          # Only exercise the redirect when real credentials are present --
          # with none configured this correctly 503s instead, which is also
          # a valid, evidenced outcome.
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            redirect_location=$(curl -s -o /dev/null -D - http://localhost:8080/auth/google | grep -i '^location:' || true)
            echo "T20 /auth/google redirect: $redirect_location"
          fi

          docker stop t14-smoke

      - name: Record image evidence
        run: |
          {
            echo "### Production Docker image"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Image tag | \`deploy-sprint/blackops:${{ github.sha }}\` |"
            echo "| Image ID | \`$(docker image inspect deploy-sprint/blackops:${{ github.sha }} --format '{{.Id}}')\` |"
            echo "| Size | \`$(docker image inspect deploy-sprint/blackops:${{ github.sha }} --format '{{.Size}}')\` bytes |"
            echo "| Smoke test | \`GET /\` and \`GET /health/\` both succeeded against a running container |"
            echo "| T20 auth status (\`/status/auth\`) | \`${{ steps.smoke.outputs.auth_status }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  compose-validate:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ github.sha }}
      APP_PORT: 8081
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write placeholder .env for Compose
        run: |
          {
            echo "APP_VERSION=$APP_VERSION"
            echo "APP_PORT=$APP_PORT"
          } > .env

      - name: Validate Compose config
        run: docker compose config

      - name: Build service via Compose
        run: docker compose build

      - name: Start service and smoke-test it
        run: |
          docker compose up -d
          for i in $(seq 1 10); do
            if curl -sf "http://localhost:${APP_PORT}/health/" > /dev/null; then
              echo "Compose-run container served /health successfully."
              break
            fi
            if [ "$i" -eq 10 ]; then
              echo "Compose-run container never became healthy."
              docker compose logs
              exit 1
            fi
            sleep 1
          done
          curl -sf "http://localhost:${APP_PORT}/" > /dev/null

      - name: Record Compose evidence
        if: always()
        run: |
          {
            echo "### Docker Compose runtime"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Project name | \`deploy-sprint-blackops\` (set via \`name:\` in docker-compose.yml) |"
            echo "| Image | \`deploy-sprint/team-site:${APP_VERSION}\` |"
            echo "| Published port | \`${APP_PORT}\` |"
            echo "| \`docker compose config\` | passed |"
            echo "| Smoke test | \`GET /\` and \`GET /health/\` both succeeded against the Compose-run container |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tear down
        if: always()
        run: docker compose down -v

  dry-run-deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: downloaded-dist

      - name: Verify no rebuild happened, list artifact contents
        run: |
          echo "Deploying pre-built artifact only. No npm ci / npm run build in this job."
          find downloaded-dist -maxdepth 2 -type f | sort

      - name: Record artifact identity in workflow summary
        run: |
          {
            echo "### Build-once deploy identity"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Artifact name | \`site-dist-${{ github.sha }}\` |"
            echo "| Commit SHA | \`${{ github.sha }}\` |"
            echo "| Build workflow run | [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
          } >> "$GITHUB_STEP_SUMMARY"
