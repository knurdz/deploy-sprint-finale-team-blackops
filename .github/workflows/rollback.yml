name: Rollback To Known-Good Release

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Known-good tag, SHA, or branch to redeploy
        required: true

permissions:
  contents: read

concurrency:
  group: rollback-deploy
  cancel-in-progress: false

jobs:
  rollback:
    name: Resolve, rebuild, and request rollback deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate release_ref input
        run: |
          set -euo pipefail
          if [ -z "${{ inputs.release_ref }}" ]; then
            echo "release_ref input is required" >&2
            exit 1
          fi
          echo "Rollback requested for release_ref=${{ inputs.release_ref }}"

      - name: Checkout known-good release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0

      - name: Resolve concrete commit SHA
        id: resolve
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "### Rollback target resolved"
            echo "- release_ref input: \`${{ inputs.release_ref }}\`"
            echo "- resolved commit: \`$sha\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Resolved release_ref '${{ inputs.release_ref }}' to commit $sha"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: team-site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: team-site

      - name: Build known-good release
        run: npm run build
        working-directory: team-site

      - name: Confirm build matches resolved rollback target
        working-directory: team-site
        run: |
          set -euo pipefail
          built_sha="$(node -e "console.log(JSON.parse(require('fs').readFileSync('dist/status/index.html','utf8')).commit)")"
          echo "Build produced status commit: $built_sha"
          if [ "$built_sha" != "${{ steps.resolve.outputs.sha }}" ]; then
            echo "Build output commit does not match the resolved rollback target" >&2
            exit 1
          fi
          echo "Verified: rebuilt dist matches rollback target $built_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Request rollback deploy from organizer deployer
        env:
          DEPLOYER_DISPATCH_TOKEN: ${{ secrets.DEPLOYER_DISPATCH_TOKEN }}
          DEPLOYER_REPO: knurdz/deploy-sprint-deployer
          TEAM_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ steps.resolve.outputs.sha }}
          RELEASE_REF: ${{ inputs.release_ref }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "$DEPLOYER_DISPATCH_TOKEN" ]; then
            echo "DEPLOYER_DISPATCH_TOKEN is not configured."
            exit 1
          fi

          python3 - <<'PY' > payload.json
          import json
          import os

          payload = {
              "event_type": "team-blackops-main-merged",
              "client_payload": {
                  "team": "blackops",
                  "repo": os.environ["TEAM_REPO"],
                  "sha": os.environ["TARGET_SHA"],
                  "branch": "main",
                  "source_run_id": os.environ["SOURCE_RUN_ID"],
                  "rollback": True,
                  "release_ref": os.environ["RELEASE_REF"],
              },
          }

          print(json.dumps(payload))
          PY

          curl --fail-with-body --show-error --silent \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DEPLOYER_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${DEPLOYER_REPO}/dispatches" \
            --data @payload.json

          {
            echo "### Rollback deploy requested"
            echo "- target commit: \`${TARGET_SHA}\`"
            echo "- release_ref: \`${RELEASE_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Requested rollback deploy for ${TEAM_REPO}@${TARGET_SHA} (release_ref=${RELEASE_REF})."
